name: Deploy private V7 preview

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-v7-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node --test tests/preview-auth.test.mjs
      - run: pnpm build:cloudflare
      - name: Publish to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist/cloudflare --project-name=chuanjiang-v7 --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
